<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassmorphism Calculator</title>
<style>
:root {
--glass-bg: rgba(255, 255, 255, 0.1);
--glass-border: rgba(255, 255, 255, 0.2);
--text-color: #ffffff;
--accent-color: #6366f1;

body {

display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
margin: 0;
}

.calculator {
background: var(--glass-bg);
backdrop-filter: blur(15px);
border: 1px solid var(--glass-border);
padding: 20px;
border-radius: 20px;
width: 350px;
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

<input type="text" id="display" readonly>

<div class="grid" id="buttons">
<!-- Buttons generated by JS -->
</div>

<div class="history" id="history">History:</div>
</div>

<script>
const display = document.getElementById('display');
const historyDiv = document.getElementById('history');
let currentMode = 'standard';

function setMode(mode) {
currentMode = mode;
renderButtons();
}

function renderButtons() {
const container = document.getElementById('buttons');
container.innerHTML = '';
const buttons = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];

buttons.forEach(btn => {
const b = document.createElement('button');
b.innerText = btn;
b.onclick = () => handleInput(btn);
container.appendChild(b);
});
}

function handleInput(val) {
if(val === '=') {
try {
const result = eval(display.value);
saveHistory(`${display.value} = ${result}`);
display.value = result;
} catch { display.value = 'Error'; }
} else if(val === 'C') {
display.value = '';
} else {
display.value += val;
}
}

function saveHistory(entry) {
let history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
history.push(entry);
localStorage.setItem('calcHistory', JSON.stringify(history.slice(-5)));
loadHistory();
}

function loadHistory() {
const history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
historyDiv.innerHTML = 'History:<br>' + history.join('<br>');
}

// Init
renderButtons();
loadHistory();
</script>

</body>
