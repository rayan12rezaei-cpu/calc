<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>GlassCalc — Advanced Calculator</title>
  <style>
    :root{
      --bg:#070b16;
      --panel:rgba(19,27,49,.62);
      --panel-2:rgba(255,255,255,.055);
      --border:rgba(255,255,255,.13);
      --text:#f4f7ff;
      --muted:#98a4bf;
      --accent:#7c5cff;
      --accent-2:#20d6c7;
      --danger:#ff5d7d;
      --shadow:0 24px 70px rgba(0,0,0,.42);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    body{
      min-height:100vh; overflow-x:hidden;
      background:
        radial-gradient(circle at 15% 10%,rgba(124,92,255,.22),transparent 32%),
        radial-gradient(circle at 88% 15%,rgba(32,214,199,.13),transparent 28%),
        radial-gradient(circle at 55% 100%,rgba(88,60,180,.14),transparent 35%),
        var(--bg);
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;
      background:linear-gradient(120deg,rgba(255,255,255,.025),transparent 30%,rgba(255,255,255,.015));
    }
    button,input,select{font:inherit}
    button{cursor:pointer;color:inherit}
    .app{width:min(1250px,calc(100% - 28px));margin:0 auto;padding:24px 0 34px}
    .glass{
      background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);
      backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%);
    }
    header{
      display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;padding:16px 20px;border-radius:20px
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,var(--accent),#4c9cff);box-shadow:0 10px 28px rgba(124,92,255,.3)}
    .brand h1{font-size:18px;margin:0}.brand small{color:var(--muted)}
    .shortcut{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:8px 11px;border-radius:10px}
    .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,.7fr);gap:18px}
    .calculator{border-radius:var(--radius);padding:18px}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
    .tab{border:1px solid transparent;background:transparent;color:var(--muted);padding:11px 7px;border-radius:12px;font-weight:700;font-size:13px}
    .tab:hover{background:var(--panel-2);color:var(--text)}
    .tab.active{color:white;background:linear-gradient(135deg,rgba(124,92,255,.34),rgba(32,214,199,.13));border-color:rgba(124,92,255,.4)}
    .display{min-height:142px;padding:20px 18px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
    .expression{min-height:28px;text-align:right;color:var(--muted);font-size:16px;white-space:nowrap;overflow:auto}
    .result{margin-top:7px;text-align:right;font-size:clamp(32px,6vw,50px);font-weight:800;letter-spacing:-1.5px;white-space:nowrap;overflow:auto}
    .subline{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11px}
    .keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}
    .key{
      min-height:54px;border-radius:15px;border:1px solid var(--border);background:rgba(255,255,255,.055);
      transition:.16s transform,.16s background,.16s border-color;user-select:none
    }
    .key:hover{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22)}
    .key:active{transform:scale(.96)}
    .key.op{background:rgba(124,92,255,.14);color:#d9d2ff}
    .key.equal{background:linear-gradient(135deg,var(--accent),#5a7dff);border-color:transparent;font-weight:900}
    .key.danger{color:#ff9db2}
    .key.func{color:#9deee7;background:rgba(32,214,199,.08)}
    .key.wide{grid-column:span 2}
    .section{margin-top:14px}
    .section-title{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
    .program-controls,.math-controls{display:flex;gap:8px;flex-wrap:wrap}
    select,.mini-input{
      background:rgba(255,255,255,.055);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px;outline:none
    }
    option{background:#11182a;color:white}
    .program-output{margin-top:10px;padding:12px;border:1px solid var(--border);border-radius:13px;background:rgba(0,0,0,.17);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.7;overflow:auto}
    .history{border-radius:var(--radius);padding:18px;min-height:100%;display:flex;flex-direction:column}
    .history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .history h2{font-size:16px;margin:0}.history-count{color:var(--muted);font-size:11px}
    .clear{border:1px solid rgba(255,93,125,.25);background:rgba(255,93,125,.08);color:#ff9db2;border-radius:10px;padding:8px 10px;font-size:12px}
    .history-list{display:flex;flex-direction:column;gap:8px;overflow:auto;max-height:650px}
    .history-item{padding:12px;border-radius:13px;background:rgba(255,255,255,.045);border:1px solid transparent;cursor:pointer}
    .history-item:hover{border-color:var(--border);background:rgba(255,255,255,.07)}
    .history-exp{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .history-result{font-size:18px;font-weight:800;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .history-mode{font-size:10px;color:#9deee7;margin-top:5px;text-transform:uppercase}
    .empty{color:var(--muted);text-align:center;padding:40px 15px;font-size:13px}
    .hidden{display:none!important}
    .footer{text-align:center;color:#66728d;font-size:11px;margin-top:14px}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.history-list{max-height:330px}}
    @media(max-width:560px){
      .app{width:min(100% - 14px,1250px);padding-top:8px}.shortcut{display:none}
      .calculator,.history{padding:12px}.tabs{grid-template-columns:repeat(2,1fr)}
      .key{min-height:49px;font-size:13px}.display{min-height:125px}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="glass">
    <div class="brand">
      <div class="logo">∑</div>
      <div><h1>GlassCalc</h1><small>Dark glassmorphism calculator</small></div>
    </div>
    <div class="shortcut">Keyboard supported · History saved locally</div>
  </header>

  <main class="layout">
    <section class="calculator glass">
      <div class="tabs">
        <button class="tab active" data-mode="standard">Standard</button>
        <button class="tab" data-mode="scientific">Scientific</button>
        <button class="tab" data-mode="programming">Programming</button>
        <button class="tab" data-mode="advanced">Adv Math</button>
      </div>

      <div class="display">
        <div id="expression" class="expression">0</div>
        <div id="result" class="result">0</div>
        <div class="subline"><span id="status">Ready</span><span id="angleStatus">DEG</span></div>
      </div>

      <div id="keypad" class="keypad"></div>

      <div id="programmingPanel" class="section hidden">
        <div class="section-title"><span>Programming</span><span>32-bit signed / unsigned display</span></div>
        <div class="program-controls">
          <select id="bitWidth"><option value="32">32-bit</option><option value="16">16-bit</option><option value="8">8-bit</option></select>
          <select id="baseSelect"><option value="10">DEC</option><option value="16">HEX</option><option value="8">OCT</option><option value="2">BIN</option></select>
        </div>
        <div id="programOutput" class="program-output">DEC: 0<br>HEX: 0<br>OCT: 0<br>BIN: 0</div>
      </div>

      <div id="mathPanel" class="section hidden">
        <div class="section-title"><span>Advanced Math</span><span>Expression engine</span></div>
        <div class="math-controls">
          <button class="key func" data-insert="derivative(">Derivative</button>
          <button class="key func" data-insert="integral(">Integral</button>
          <button class="key func" data-insert="factorial(">Factorial</button>
          <button class="key func" data-insert="gcd(">GCD</button>
          <button class="key func" data-insert="lcm(">LCM</button>
        </div>
      </div>
    </section>

    <aside class="history glass">
      <div class="history-head">
        <div><h2>History</h2><div class="history-count" id="historyCount">0 calculations</div></div>
        <button class="clear" id="clearHistory">Clear</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </aside>
  </main>
  <div class="footer">Static HTML · CSS · JavaScript · GitHub Pages ready</div>
</div>

<script>
(() => {
  "use strict";

  const $ = s => document.querySelector(s);
  const expressionEl = $("#expression"), resultEl = $("#result"), statusEl = $("#status");
  const angleStatus = $("#angleStatus"), keypad = $("#keypad");
  const historyList = $("#historyList"), historyCount = $("#historyCount");
  const programPanel = $("#programmingPanel"), mathPanel = $("#mathPanel");
  const STORAGE_KEY = "glasscalc-history-v1";

  let mode = "standard", angle = "DEG", expression = "", lastResult = "0";
  let justEvaluated = false;

  const keysets = {
    standard: [
      ["AC","danger"],["⌫","danger"],["%","op"],["÷","op"],["×","op"],
      ["7"],["8"],["9"],["−","op"],["+" ,"op"],
      ["4"],["5"],["6"],["(", "op"],[")","op"],
      ["1"],["2"],["3"],[".",""],["=","equal"],
      ["0","wide"],["00"],["±","op"]
    ],
    scientific: [
      ["AC","danger"],["⌫","danger"],["sin(","func"],["cos(","func"],["tan(","func"],
      ["7"],["8"],["9"],["÷","op"],["√(","func"],
      ["4"],["5"],["6"],["×","op"],["ln(","func"],
      ["1"],["2"],["3"],["−","op"],["log(","func"],
      ["0","wide"],[".",""],["π","func"],["^","op"],["=","equal"],
      ["e","func"],["!","func"],["±","op"],["Ans","func"],["RAD","func"]
    ],
    programming: [
      ["AC","danger"],["⌫","danger"],["AND","op"],["OR","op"],["XOR","op"],
      ["7"],["8"],["9"],["<<","op"],[">>","op"],
      ["4"],["5"],["6"],["MOD","op"],["NOT","op"],
      ["1"],["2"],["3"],["−","op"],["+" ,"op"],
      ["0","wide"],["A","func"],["B","func"],["C","func"],["=","equal"],
      ["D","func"],["E","func"],["F","func"],["±","op"],["Ans","func"]
    ],
    advanced: [
      ["AC","danger"],["⌫","danger"],["factorial(","func"],["gcd(","func"],["lcm(","func"],
      ["7"],["8"],["9"],["÷","op"],["abs(","func"],
      ["4"],["5"],["6"],["×","op"],["floor(","func"],
      ["1"],["2"],["3"],["−","op"],["ceil(","func"],
      ["0","wide"],[".",""],["sqrt(","func"],["^","op"],["=","equal"],
      ["derivative(","func"],["integral(","func"],["Ans","func"],["%","op"],["+" ,"op"]
    ]
  };

  function renderKeys() {
    keypad.innerHTML = "";
    keysets[mode].forEach(([label, cls]) => {
      const b = document.createElement("button");
      b.className = `key ${cls || ""}`;
      b.textContent = label;
      b.dataset.key = label;
      keypad.appendChild(b);
    });
    angleStatus.textContent = angle;
    programPanel.classList.toggle("hidden", mode !== "programming");
    mathPanel.classList.toggle("hidden", mode !== "advanced");
  }

  function insert(text) {
    if (justEvaluated && !["+", "−", "×", "÷", "^", "%"].includes(text)) expression = "";
    justEvaluated = false;
    expression += text;
    expressionEl.textContent = expression || "0";
    statusEl.textContent = mode === "programming" ? "Bitwise mode" : "Editing";
    if (mode === "programming") updateProgram();
  }

  function backspace() {
    justEvaluated = false;
    expression = expression.slice(0, -1);
    expressionEl.textContent = expression || "0";
  }

  function clearAll() {
    expression = ""; lastResult = "0"; justEvaluated = false;
    expressionEl.textContent = "0"; resultEl.textContent = "0"; statusEl.textContent = "Ready";
    if (mode === "programming") updateProgram();
  }

  function normalize(expr) {
    return expr
      .replaceAll("×","*").replaceAll("÷","/").replaceAll("−","-")
      .replaceAll("π","pi").replaceAll("√","sqrt")
      .replace(/(\d+(?:\.\d+)?)%/g, "($1/100)")
      .replace(/\^/g, "**");
  }

  function factorial(n) {
    if (!Number.isFinite(n) || n < 0 || Math.floor(n) !== n || n > 170) throw new Error("Invalid factorial");
    let r=1; for(let i=2;i<=n;i++) r*=i; return r;
  }
  function gcd(a,b){a=Math.abs(Math.trunc(a));b=Math.abs(Math.trunc(b));while(b){[a,b]=[b,a%b]}return a}
  function lcm(a,b){return Math.abs(Math.trunc(a)*Math.trunc(b))/gcd(a,b)}
  function toRad(x){return angle==="DEG"?x*Math.PI/180:x}
  function fromRad(x){return angle==="DEG"?x*180/Math.PI:x}

  function derivative(f,x,h=1e-5){return (f(x+h)-f(x-h))/(2*h)}
  function numericalIntegral(f,a,b,n=1000){
    let h=(b-a)/n, sum=f(a)+f(b);
    for(let i=1;i<n;i++) sum += (i%2 ? 4:2)*f(a+i*h);
    return sum*h/3;
  }

  function evaluate(expr) {
    let e = normalize(expr.trim());
    if (!e) return 0;

    // Advanced helper syntax: derivative(expr,x) and integral(expr,a,b)
    // Uses a safe small expression parser for the variable x.
    e = e.replace(/derivative\(([^,]+),([^,]+)\)/g, (_, f, x) => {
      const fn = makeXFunction(f); return derivative(fn, Number(x));
    });
    e = e.replace(/integral\(([^,]+),([^,]+),([^)]+)\)/g, (_, f, a, b) => {
      const fn = makeXFunction(f); return numericalIntegral(fn, Number(a), Number(b));
    });

    const scope = {
      pi: Math.PI, e: Math.E,
      sin:x=>Math.sin(toRad(x)), cos:x=>Math.cos(toRad(x)), tan:x=>Math.tan(toRad(x)),
      asin:x=>fromRad(Math.asin(x)), acos:x=>fromRad(Math.acos(x)), atan:x=>fromRad(Math.atan(x)),
      sqrt:Math.sqrt, cbrt:Math.cbrt, abs:Math.abs, floor:Math.floor, ceil:Math.ceil,
      round:Math.round, ln:Math.log, log:x=>Math.log10(x), log2:Math.log2,
      exp:Math.exp, pow:Math.pow, min:Math.min, max:Math.max,
      factorial, gcd, lcm
    };

    // Keep calculator input constrained to mathematical tokens/functions.
    if (!/^[0-9+\-*/().,\sA-Za-z_<>!%&|^]+$/.test(e)) throw new Error("Invalid characters");
    if (/[;={}[\]`$\\]/.test(e)) throw new Error("Invalid expression");

    // Programming operators are handled separately.
    if (mode === "programming" && /\b(AND|OR|XOR|NOT|MOD)\b/.test(expr)) return evalBitwise(expr);

    e = e.replace(/(\d+(?:\.\d+)?)!/g, "factorial($1)");
    e = e.replace(/(\d+)\s*mod\s*(\d+)/gi, "($1%$2)");

    const names = Object.keys(scope);
    const values = Object.values(scope);
    // Function constructor is restricted by the whitelist above and is only used
    // for local, static calculator input; no external data or code is executed.
    const fn = Function(...names, `"use strict"; return (${e})`);
    const value = fn(...values);
    if (!Number.isFinite(value)) throw new Error("Result is not finite");
    return value;
  }

  function makeXFunction(expr) {
    const clean = normalize(expr).replace(/(\d+(?:\.\d+)?)!/g,"factorial($1)");
    if (!/^[0-9x+\-*/().,\sA-Za-z_^]+$/i.test(clean)) throw new Error("Invalid function");
    const names = ["x","pi","e","sin","cos","tan","sqrt","abs","ln","log","factorial"];
    const vals = [0,Math.PI,Math.E,Math.sin,Math.cos,Math.tan,Math.sqrt,Math.abs,Math.log,Math.log10,factorial];
    return x => Function(...names, `"use strict";return (${clean})`)(x,...vals.slice(1));
  }

  function evalBitwise(expr) {
    let e = expr.toUpperCase().replaceAll("AND","&").replaceAll("OR","|").replaceAll("XOR","^").replaceAll("MOD","%").replaceAll("NOT","~").replaceAll("−","-");
    if (!/^[0-9A-FxX\s&|^%~()+\-<>]+$/.test(e)) throw new Error("Invalid bitwise expression");
    return Function(`"use strict";return (${e})`)();
  }

  function format(n) {
    if (Object.is(n,-0)) n=0;
    if (Number.isInteger(n)) return n.toLocaleString("en-US");
    return Number(n.toPrecision(12)).toString();
  }

  function calculate() {
    try {
      const value = evaluate(expression);
      const shown = format(value);
      resultEl.textContent = shown;
      lastResult = String(value);
      statusEl.textContent = "Calculated";
      addHistory(expression || "0", shown, mode);
      justEvaluated = true;
      if (mode === "programming") updateProgram(value);
    } catch (err) {
      resultEl.textContent = "Error";
      statusEl.textContent = err.message || "Invalid expression";
    }
  }

  function addHistory(exp,res,calcMode) {
    const list = loadHistory();
    list.unshift({exp,res,mode:calcMode,time:Date.now()});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list.slice(0,100)));
    renderHistory();
  }
  function loadHistory(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []}catch{return []}
  }
  function renderHistory(){
    const list=loadHistory();
    historyCount.textContent=`${list.length} calculation${list.length===1?"":"s"}`;
    historyList.innerHTML="";
    if(!list.length){historyList.innerHTML='<div class="empty">No calculations yet.<br>Your history will stay on this device.</div>';return}
    list.forEach(item=>{
      const el=document.createElement("div");el.className="history-item";
      el.innerHTML=`<div class="history-exp">${escapeHtml(item.exp)}</div><div class="history-result">= ${escapeHtml(item.res)}</div><div class="history-mode">${escapeHtml(item.mode)}</div>`;
      el.onclick=()=>{expression=item.exp;expressionEl.textContent=item.exp;resultEl.textContent=item.res;justEvaluated=true};
      historyList.appendChild(el);
    });
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

  function updateProgram(value) {
    let n = Number.isFinite(value) ? value : Number(expression || 0);
    if (!Number.isFinite(n)) n=0;
    const bits=Number($("#bitWidth").value);
    const unsigned = BigInt(Math.trunc(n)) & ((1n<<BigInt(bits))-1n);
    const signed = unsigned >= (1n<<BigInt(bits-1)) ? unsigned-(1n<<BigInt(bits)) : unsigned;
    const dec=String(signed), hex=unsigned.toString(16).toUpperCase(), oct=unsigned.toString(8), bin=unsigned.toString(2).padStart(bits,"0");
    $("#programOutput").innerHTML=`DEC: ${dec}<br>HEX: ${hex}<br>OCT: ${oct}<br>BIN: ${bin}`;
  }

  keypad.addEventListener("click", e=>{
    const b=e.target.closest(".key"); if(!b)return;
    const k=b.dataset.key;
    if(k==="AC") return clearAll();
    if(k==="⌫") return backspace();
    if(k==="=") return calculate();
    if(k==="±"){
      if(expression && /^-?\d+(?:\.\d+)?$/.test(expression)) expression=expression.startsWith("-")?expression.slice(1):"-"+expression;
      else expression=`-(${expression||0})`;
      expressionEl.textContent=expression;return;
    }
    if(k==="RAD"){angle=angle==="DEG"?"RAD":"DEG";angleStatus.textContent=angle;return}
    if(k==="Ans"){insert(lastResult);return}
    if(k==="e"){insert("e");return}
    if(k==="AND"||k==="OR"||k==="XOR"||k==="MOD"){insert(k);return}
    if(k==="NOT"){insert("NOT ");return}
    insert(k);
  });

  document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{
    mode=tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===tab));
    renderKeys(); clearAll();
    statusEl.textContent=`${mode==="advanced"?"Advanced Math":mode[0].toUpperCase()+mode.slice(1)} mode`;
  }));

  $("#clearHistory").onclick=()=>{localStorage.removeItem(STORAGE_KEY);renderHistory()};
  $("#bitWidth").onchange=()=>updateProgram();
  $("#baseSelect").onchange=()=>updateProgram();

  document.querySelectorAll("[data-insert]").forEach(b=>b.addEventListener("click",()=>insert(b.dataset.insert)));

  document.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key;
    if(/^[0-9.]$/.test(k)) insert(k);
    else if(k==="+")insert("+");
    else if(k==="-")insert("−");
    else if(k==="*")insert("×");
    else if(k==="/"){e.preventDefault();insert("÷")}
    else if(k==="("||k===")")insert(k);
    else if(k==="Enter"||k==="="){e.preventDefault();calculate()}
    else if(k==="Backspace")backspace();
    else if(k==="Escape")clearAll();
    else if(k==="%")insert("%");
  });

  renderKeys();
  renderHistory();
})();
</script>
</body>
</html>
